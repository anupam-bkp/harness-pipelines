pipeline:
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: HelloDockerEcsDeploy2Stage
        identifier: HelloDockerEcsDeploy2Stage
        description: ""
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: HelloWorldDockerECSDeployLBService
            gitBranch: main
          environment:
            environmentRef: helloworldecsdeploylbenv
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: HelloWorldDockerECSDeployInfra
          execution:
            steps:
              - step:
                  name: ECS Rolling Deploy
                  identifier: ecsRollingDeploy
                  type: EcsRollingDeploy
                  timeout: 10m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
            rollbackSteps:
              - step:
                  name: ECS Rolling Rollback
                  identifier: ecsRollingRollback
                  type: EcsRollingRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  identifier: HelloDockerECSDeployLB
  name: HelloDockerECSDeployLB
